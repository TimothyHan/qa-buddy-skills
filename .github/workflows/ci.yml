name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Reproduce the default Windows git environment that broke v0.2.0:
      # core.autocrlf=true checks text files out with CRLF
      - name: Emulate Windows default git config
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ko FIRST, then structural tests before the en build exists —
      # proves a ko-only checkout passes (TC-INST-014, was a reported P2)
      - name: Build (ko)
        run: node build.js all --locale ko

      - name: Structural tests (ko-only dist)
        if: runner.os == 'Linux'
        run: node test.js

      - name: Build (en)
        run: node build.js all

      - name: Structural tests
        run: node test.js

      # Windows PowerShell 5.1 (the OS-bundled shell, not pwsh 7) is what a
      # default Windows user runs — v0.2.0's 3-arg Join-Path broke only there
      # A decoy skill named like ours but owned by "another tool" must survive
      # install → status → uninstall untouched (issue #6: ownership verification)
      - name: Install via setup.ps1 under PowerShell 5.1 (with foreign decoy)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\.claude\skills" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:TEMP\foreign-tool\setup" | Out-Null
          New-Item -ItemType SymbolicLink -Path "$HOME\.claude\skills\setup" -Target "$env:TEMP\foreign-tool\setup" -Force | Out-Null
          & dist/claude/setup.ps1
          # Write-Host lands on the information stream (6) in PS 5.1 — without
          # 6>&1 the capture is empty and every -match assertion passes vacuously
          $status = & dist/claude/setup.ps1 -Status 6>&1 | Out-String
          Write-Host $status
          if ($status -match 'MISSING|FAIL|SKIP') { throw 'Status reported MISSING/FAIL/SKIP entries' }
          if ($status -notmatch 'FOREIGN setup') { throw 'Foreign decoy was not flagged FOREIGN in status' }
          & dist/claude/setup.ps1 -Uninstall
          if (-not (Test-Path "$HOME\.claude\skills\setup")) { throw 'Uninstall deleted a foreign skill (decoy gone)' }
          $decoy = Get-Item "$HOME\.claude\skills\setup" -Force
          if (@($decoy.Target)[0] -notlike "*foreign-tool*") { throw 'Decoy no longer points at its original target' }
          # Reinstall idempotency (TC-INST-013 / Gap G2): second install over an
          # owned install must replace cleanly — all OK, zero FAIL/SKIP
          & dist/claude/setup.ps1 6>&1 | Out-Null
          $second = & dist/claude/setup.ps1 6>&1 | Out-String
          Write-Host $second
          if ($second -match 'FAIL|SKIP') { throw 'Second install is not idempotent' }
          # Expected = one per shipped skill + the references dir. Derived, not hardcoded:
          # a literal count silently breaks whenever a skill is added or removed.
          $expected = (Get-ChildItem dist/claude/skills -Directory).Count + 1
          $okCount = ($second | Select-String '  OK      ' -AllMatches).Matches.Count
          if ($okCount -lt $expected) { throw "Second install reported $okCount OK items, expected $expected" }
          # -NoPrefix onto a foreign bare name must FAIL, never overwrite (TC-INST-009 / issue 6-a)
          $np = & dist/claude/setup.ps1 -NoPrefix 6>&1 | Out-String
          Write-Host $np
          if ($np -notmatch 'FAIL    setup') { throw 'NoPrefix did not FAIL on the foreign setup decoy' }
          $decoy2 = Get-Item "$HOME\.claude\skills\setup" -Force
          if (@($decoy2.Target)[0] -notlike '*foreign-tool*') { throw 'NoPrefix overwrote the foreign decoy' }
          & dist/claude/setup.ps1 -Uninstall
          if (-not (Test-Path "$HOME\.claude\skills\setup")) { throw 'Final uninstall deleted the foreign decoy' }

      # --adopt migration smoke (TC-INST-016). Deliberate exception to the
      # unverified-tier policy: a broken adopt would strand exactly the
      # pre-v0.2.3 copy-install users it exists to rescue.
      - name: Adopt migration smoke (copilot bash)
        if: runner.os == 'Linux'
        run: |
          tmp=$(mktemp -d); cd "$tmp"; git init -q .
          mkdir -p .github/skills/qa-test-plan
          printf '%s\n' '---' 'name: test-plan' '---' 'QABuddy legacy skill body' > .github/skills/qa-test-plan/SKILL.md
          mkdir -p .github/skills/qa-eval
          echo 'some other tool, no marker, no adoption evidence' > .github/skills/qa-eval/SKILL.md
          "$GITHUB_WORKSPACE/dist/copilot/setup" --adopt | tee adopt.log
          grep -q 'ADOPTED  qa-test-plan' adopt.log
          ! grep -q 'ADOPTED  qa-eval' adopt.log
          grep -q 'FAIL    qa-eval' adopt.log
          test -f .github/skills/qa-test-plan/.qabuddy-owned
          "$GITHUB_WORKSPACE/dist/copilot/setup" --uninstall | tee unadopt.log
          grep -q 'SKIP     qa-eval' unadopt.log
          test -d .github/skills/qa-eval

      - name: Adopt migration smoke (cursor bash, project mode)
        if: runner.os == 'Linux'
        run: |
          tmp=$(mktemp -d); cd "$tmp"
          mkdir -p .cursor/skills/qa-improve .cursor/skills/qa-eval
          printf 'QABuddy legacy body\n' > .cursor/skills/qa-improve/SKILL.md
          echo 'no adoption evidence here' > .cursor/skills/qa-eval/SKILL.md
          "$GITHUB_WORKSPACE/dist/cursor/setup" --adopt | tee adopt.log
          grep -q 'ADOPTED  qa-improve' adopt.log
          ! grep -q 'ADOPTED  qa-eval' adopt.log
          test -f .cursor/skills/qa-improve/.qabuddy-owned
          "$GITHUB_WORKSPACE/dist/cursor/setup" --project | tee proj.log
          grep -q 'FAIL    qa-eval' proj.log
          grep -q 'OK      qa-improve (copied)' proj.log
          test -d .cursor/skills/qa-eval
          "$GITHUB_WORKSPACE/dist/cursor/setup" --uninstall > /dev/null

      # -Adopt smoke under real PS 5.1 — the migration primarily serves
      # Windows users (the original reporter's environment)
      - name: Adopt migration smoke (copilot ps1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tmp = New-Item -ItemType Directory -Path (Join-Path $env:TEMP ("qab-" + [guid]::NewGuid().ToString('N').Substring(0,8)))
          Set-Location $tmp
          git init -q .
          New-Item -ItemType Directory -Force -Path .github/skills/qa-test-plan, .github/skills/qa-eval | Out-Null
          Set-Content .github/skills/qa-test-plan/SKILL.md "QABuddy legacy skill body"
          Set-Content .github/skills/qa-eval/SKILL.md 'no adoption evidence here'
          $log = & "$env:GITHUB_WORKSPACE\dist\copilot\setup.ps1" -Adopt 6>&1 | Out-String
          Write-Host $log
          if ($log -notmatch 'ADOPTED  qa-test-plan') { throw 'legacy copy was not adopted' }
          if ($log -match 'ADOPTED  qa-eval') { throw 'no-evidence dir was wrongly adopted' }
          if ($log -notmatch 'FAIL    qa-eval') { throw 'no FAIL guidance for unowned dir' }
          if (-not (Test-Path .github/skills/qa-test-plan/.qabuddy-owned)) { throw 'ownership marker missing' }
          $un = & "$env:GITHUB_WORKSPACE\dist\copilot\setup.ps1" -Uninstall 6>&1 | Out-String
          Write-Host $un
          if ($un -notmatch 'SKIP     qa-eval') { throw 'uninstall did not SKIP the unowned dir' }
          if (-not (Test-Path .github/skills/qa-eval)) { throw 'unowned dir was deleted' }
          Set-Location $env:GITHUB_WORKSPACE

      # PowerShell 7 parity (manual matrix item M2): same installer, pwsh shell
      - name: Install cycle under PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & dist/claude/setup.ps1
          & dist/claude/setup.ps1 -Status
          & dist/claude/setup.ps1 -Uninstall

      - name: Install via setup (bash, with foreign decoy)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.claude/skills" /tmp/foreign-tool/setup
          ln -sfn /tmp/foreign-tool/setup "$HOME/.claude/skills/setup"
          dist/claude/setup
          dist/claude/setup --status | tee /tmp/qabuddy-status.txt
          ! grep -Eq 'MISSING|FAIL' /tmp/qabuddy-status.txt
          grep -q 'FOREIGN setup' /tmp/qabuddy-status.txt
          dist/claude/setup --uninstall
          test -L "$HOME/.claude/skills/setup"
          test "$(readlink "$HOME/.claude/skills/setup")" = "/tmp/foreign-tool/setup"
          # Reinstall idempotency (TC-INST-013 / Gap G2)
          dist/claude/setup > /dev/null
          dist/claude/setup | tee /tmp/qabuddy-second.txt
          ! grep -Eq 'FAIL|SKIP' /tmp/qabuddy-second.txt
          # Expected = one per shipped skill + the references dir (derived, not hardcoded).
          expected=$(( $(find dist/claude/skills -mindepth 1 -maxdepth 1 -type d | wc -l) + 1 ))
          test "$(grep -c '  OK      ' /tmp/qabuddy-second.txt)" -ge "$expected"
          # -NoPrefix onto a foreign bare name must FAIL, never overwrite (TC-INST-009 / issue 6-a)
          dist/claude/setup --no-prefix | tee /tmp/qabuddy-np.txt
          grep -q 'FAIL    setup' /tmp/qabuddy-np.txt
          test "$(readlink "$HOME/.claude/skills/setup")" = "/tmp/foreign-tool/setup"
          dist/claude/setup --uninstall
          test -L "$HOME/.claude/skills/setup"

      # A skill QABuddy shipped once and no longer ships (`/qa-sprint-status`, removed in
      # #29) used to be invisible to every code path: uninstall and status both iterate the
      # skills that exist *now*, so the leftover link was never reported and never deleted —
      # it simply dangled at a build path that no longer exists, for the assistant to find.
      - name: Orphaned-skill pruning (bash)
        if: runner.os == 'Linux'
        run: |
          rm -rf "$HOME/.claude/skills"
          dist/claude/setup > /dev/null
          # A v0.5.0 leftover: ours by target, pointing at a path the build no longer makes.
          ln -s "$PWD/dist/claude/skills/sprint-status" "$HOME/.claude/skills/qa-sprint-status"
          # A same-shaped link that is NOT ours must survive every step.
          mkdir -p /tmp/foreign-tool/qa-notours
          ln -sfn /tmp/foreign-tool/qa-notours "$HOME/.claude/skills/qa-notours"
          dist/claude/setup --status | tee /tmp/orphan-status.txt
          grep -q 'ORPHAN   qa-sprint-status' /tmp/orphan-status.txt
          ! grep -q 'ORPHAN   qa-notours' /tmp/orphan-status.txt
          dist/claude/setup | tee /tmp/orphan-install.txt
          grep -q 'PRUNED   qa-sprint-status' /tmp/orphan-install.txt
          # -L, not -e: a dangling link fails -e whether or not it was actually removed.
          ! test -L "$HOME/.claude/skills/qa-sprint-status"
          test -L "$HOME/.claude/skills/qa-notours"
          # Uninstall prunes too, and still leaves the foreign link alone.
          ln -s "$PWD/dist/claude/skills/sprint-status" "$HOME/.claude/skills/qa-sprint-status"
          dist/claude/setup --uninstall | tee /tmp/orphan-uninstall.txt
          grep -q 'PRUNED   qa-sprint-status' /tmp/orphan-uninstall.txt
          ! test -L "$HOME/.claude/skills/qa-sprint-status"
          test -L "$HOME/.claude/skills/qa-notours"

      - name: Orphaned-skill pruning (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $skills = Join-Path $HOME '.claude\skills'
          if (Test-Path $skills) { Remove-Item $skills -Recurse -Force }
          & dist/claude/setup.ps1 | Out-Null
          $gone = Join-Path (Resolve-Path 'dist/claude/skills') 'sprint-status'
          New-Item -ItemType SymbolicLink -Path (Join-Path $skills 'qa-sprint-status') -Target $gone -Force | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:TEMP\foreign-tool\qa-notours" | Out-Null
          New-Item -ItemType SymbolicLink -Path (Join-Path $skills 'qa-notours') -Target "$env:TEMP\foreign-tool\qa-notours" -Force | Out-Null
          # Write-Host lands on stream 6 in PS 5.1 — without 6>&1 every -match passes vacuously.
          $status = & dist/claude/setup.ps1 -Status 6>&1 | Out-String
          Write-Host $status
          if ($status -notmatch 'ORPHAN   qa-sprint-status') { throw 'Orphan not reported by status' }
          if ($status -match 'ORPHAN   qa-notours') { throw 'Foreign link wrongly reported as an orphan' }
          $out = & dist/claude/setup.ps1 6>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'PRUNED   qa-sprint-status') { throw 'Orphan not pruned on reinstall' }
          # Test-Path follows the link, so a dangling leftover would read as absent either
          # way — enumerate the directory instead to assert the link itself is gone.
          $present = @(Get-ChildItem $skills -Force | Where-Object { $_.Name -eq 'qa-sprint-status' })
          if ($present.Count -ne 0) { throw 'Orphan link still present after prune' }
          if (-not (Test-Path (Join-Path $skills 'qa-notours'))) { throw 'Foreign link was removed' }
